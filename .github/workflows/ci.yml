name: CI
on:
  push:
    branches: [main, "rework/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_ci_only
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://studio:studio_ci_only@127.0.0.1:5432/studio_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.3-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install all workspaces once
        run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      - name: Migrations twice, unit and real PostgreSQL integration
        run: bun run test:integration
      - name: Build Core and dashboard with Bun
        run: bun run build
        env:
          NODE_ENV: production
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser through BFF, real Core and PostgreSQL (Discord simulated)
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
